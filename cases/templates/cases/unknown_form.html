{% extends 'cases/base.html' %}

{% block title %}Загрузить неизвестный корпус{% endblock %}

{% block content %}
    <h1 class="mb-4">Загрузить неизвестный корпус</h1>
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_photo" class="form-label">Фото корпуса</label>
                            <input type="file" name="photo" id="id_photo" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success">Загрузить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
